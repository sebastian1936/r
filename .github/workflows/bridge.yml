# This yaml shares the build bridge steps with ci and nightly.
name: Build flutter-rust-bridge
# 2023-11-23 18:00:00+00:00

on:
  workflow_call:

env:
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_VERSION: "3.22.3"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  RUST_VERSION: "1.75" # https://github.com/rustdesk/rustdesk/discussions/7503

jobs:
  generate_bridge:
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: x86_64-unknown-linux-gnu,
              os: ubuntu-22.04,
              extra-build-args: "",
            }
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          # GitHub runner 偶发 DNS 故障：Temporary failure resolving *.ubuntu.com
          # （2026-11 多次构建挂在此处，见设计文档 C.26），同任务其他域名解析正常，
          # 仅 Ubuntu 源域名解析失败。策略：先按默认源 apt 重试，仍失败则切到不同根域
          # 的镜像站（kernel.org / 阿里云）绕开 ubuntu.com 解析。
          # 22.04 runner 的源可能以 mirror+file 引用 /etc/apt/apt-mirrors.txt，也可能
          # 直接写在 .list/.sources 中，mirrorlist 与 sources 文件两处一并重写才生效。
          apt_install() {
            sudo apt-get install "$@" -y && return 0
            echo "::warning::apt-get install $* 首次失败，apt update 后重试"
            sleep 10
            sudo apt-get update -y || true
            sudo apt-get install "$@" -y
          }
          switch_apt_mirror() {
            for mirror in http://mirrors.edge.kernel.org/ubuntu http://mirrors.aliyun.com/ubuntu; do
              echo "::warning::尝试备用镜像: $mirror"
              echo "$mirror/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
              sudo find /etc/apt -maxdepth 2 -type f \( -name '*.list' -o -name '*.sources' \) \
                -exec sed -i -E \
                  -e "s|https?://[a-z0-9.]*ubuntu\.com/ubuntu|$mirror|g" \
                  -e "s|https?://mirrors\.edge\.kernel\.org/ubuntu|$mirror|g" \
                  -e "s|https?://mirrors\.aliyun\.com/ubuntu|$mirror|g" \
                  {} +
              if sudo apt-get update -y && sudo apt-get install "$@" -y; then return 0; fi
            done
            return 1
          }
          PKGS="ca-certificates clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget"
          if ! apt_install $PKGS; then
            switch_apt_mirror $PKGS || { echo "::error::所有 apt 源均不可用"; exit 1; }
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bridge-${{ matrix.job.os }}

      - name: Cache Bridge
        id: cache-bridge
        uses: actions/cache@v3
        with:
          path: /tmp/flutter_rust_bridge
          key: vcpkg-${{ matrix.job.arch }}

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          pushd flutter && sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' pubspec.yaml && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload Artifact
        uses: actions/upload-artifact@master
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h
