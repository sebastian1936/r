name: Android Dev Build (host + controller)

# 研发分支自动构建：push 到 dev/1.4.4 即触发，只构建 Android 双包
on:
  push:
    branches:
      - dev/1.4.4
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:
    inputs:
      generate_keystore:
        description: "仅生成签名密钥（首次配置用，不构建 APK）"
        type: boolean
        default: false
      keystore_storepass:
        description: "密钥库密码（自行设定，记录下来）"
        type: string
        required: false
      keystore_keypass:
        description: "密钥密码（自行设定，记录下来）"
        type: string
        required: false

env:
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  LLVM_VERSION: "15.0.6"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  NDK_VERSION: "r27c"
  VERSION: "1.4.4"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  # 签名优先使用 Secrets 中的正式密钥；未配置则 CI 自动生成（开发/自测用）
  ANDROID_KEYSTORE_BASE64: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-android:
    needs: [generate-bridge]
    name: android ${{ matrix.job.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { arch: aarch64, target: aarch64-linux-android, android_target: arm64-v8a, abi_flag: android-arm64 }
          - { arch: armv7, target: armv7-linux-androideabi, android_target: armeabi-v7a, abi_flag: android-arm }
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
               clang cmake curl gcc-multilib git g++ g++-multilib \
               libasound2-dev libc6-dev libclang-dev libunwind-dev \
               libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
               libgtk-3-dev libpam0g-dev libpulse-dev libva-dev \
               libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
               libxdo-dev libxfixes-dev llvm-dev nasm ninja-build \
               openjdk-17-jdk-headless pkg-config wget

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          [[ "3.24.5" == ${{ env.ANDROID_FLUTTER_VERSION }} ]] && git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_ROOT: /opt/artifacts/vcpkg
        run: |
          if ! ./flutter/build_android_deps.sh "${{ matrix.job.android_target }}"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; echo "======"; cat "$_1"; echo "======"
            done
            exit 1
          fi
        shell: bash

      - name: Restore bridge files
        uses: actions/download-artifact@master
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rustdesk-lib-cache-android
          key: ${{ matrix.job.target }}

      - name: Build rustdesk lib
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add ${{ matrix.job.target }}
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          case ${{ matrix.job.target }} in
            aarch64-linux-android) ./flutter/ndk_arm64.sh ;;
            armv7-linux-androideabi) ./flutter/ndk_arm.sh ;;
          esac
          mkdir -p ./flutter/android/app/src/main/jniLibs/${{ matrix.job.android_target }}
          cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so \
             ./flutter/android/app/src/main/jniLibs/${{ matrix.job.android_target }}/librustdesk.so

      # 用 cache 固定 CI 生成的密钥，尽量让多次构建复用同一签名，避免无法覆盖安装
      - name: Restore CI keystore
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: flutter/android/app/keystore.jks
          key: android-signing-keystore-v1

      - name: Prepare signing config
        env:
          SECRET_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_STOREPASS: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          SECRET_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SECRET_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          KS=flutter/android/app/keystore.jks
          ALIAS="$SECRET_ALIAS"; STOREPASS="$SECRET_STOREPASS"; KEYPASS="$SECRET_KEYPASS"

          if [ -n "$SECRET_KEYSTORE" ]; then
            echo "使用 Secrets 中的正式签名密钥"
            echo "$SECRET_KEYSTORE" | base64 -d > "$KS"
            [ -z "$ALIAS" ] && ALIAS=rustdesk
          else
            ALIAS=rustdesk; STOREPASS=rustdesk; KEYPASS=rustdesk
            if [ ! -f "$KS" ]; then
              echo "未配置 Secret：由 CI 生成本地签名密钥（同一 cache key 下会复用）"
              keytool -genkeypair -v -keystore "$KS" -storetype JKS \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -alias "$ALIAS" -storepass "$STOREPASS" -keypass "$KEYPASS" \
                -dname "CN=RustDesk, OU=Dev, O=RustDesk, L=Unknown, S=Unknown, C=CN"
            else
              echo "复用缓存中的签名密钥"
            fi
          fi

          cat > flutter/android/key.properties <<EOF
          storeFile=keystore.jks
          storePassword=$STOREPASS
          keyAlias=$ALIAS
          keyPassword=$KEYPASS
          EOF

      - name: Build apk (host + controller)
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          mkdir -p ./flutter/android/app/src/main/jniLibs/${{ matrix.job.android_target }}
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/${{ matrix.job.sysroot }}/libc++_shared.so \
             ./flutter/android/app/src/main/jniLibs/${{ matrix.job.android_target }}/
          cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so \
             ./flutter/android/app/src/main/jniLibs/${{ matrix.job.android_target }}/librustdesk.so
          pushd flutter
          # 被控完整包
          flutter build apk --release --flavor host --target-platform ${{ matrix.job.abi_flag }} --split-per-abi
          # 纯主控包（Manifest 已裁剪敏感权限与被控组件）
          # CONTROLLER_ONLY=true 让 Dart 侧 isOutgoingOnlyMode() 恒为 true，
          # 隐藏“共享本机桌面/ID/密码/被控设置”等入口
          flutter build apk --release --flavor controller --target-platform ${{ matrix.job.abi_flag }} --split-per-abi --dart-define=CONTROLLER_ONLY=true
          popd
          mkdir -p apk-out
          cp flutter/build/app/outputs/flutter-apk/app-${{ matrix.job.android_target }}-host-release.apk \
             apk-out/rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.apk
          cp flutter/build/app/outputs/flutter-apk/app-${{ matrix.job.android_target }}-controller-release.apk \
             apk-out/rustdesk-${{ env.VERSION }}-controller-${{ matrix.job.arch }}.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@master
        with:
          name: rustdesk-android-${{ matrix.job.arch }}
          path: apk-out/*.apk
